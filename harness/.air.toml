root = "."
tmp_dir = "/tmp/air"

[build]
cmd = "templ generate && go build -o /tmp/harness ."
bin = "/tmp/harness"
include_ext = ["go", "templ"]
exclude_regex = ["_templ\\.go$", "_test\\.go$"]
exclude_dir = ["data", "node_modules", "static", "scripts"]
delay = 1000
poll = true
poll_interval = 1000
stop_on_error = false
send_interrupt = true
kill_delay = "3s"

[log]
time = false

[misc]
clean_on_exit = false
