services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8080:8080"
      - "8081-8180:8081-8180"
      - "9001-9100:9001-9100"
    volumes:
      - ..:/app:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    env_file: .env
    environment:
      - CGO_ENABLED=1
      - DEV_MODE=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  go-mod-cache:
  go-build-cache:
  cargo-registry:
  cargo-git:
