version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        emit_interface: true
        emit_empty_slices: true
        rename:
          discord_id: "DiscordID"
          discord_username: "DiscordUsername"
          github_id: "GitHubID"
          github_username: "GitHubUsername"
          avatar_url: "AvatarURL"
          created_by: "CreatedBy"
          created_at: "CreatedAt"
          last_seen_at: "LastSeenAt"
          user_id: "UserID"
          expires_at: "ExpiresAt"
          world_id: "WorldID"
          parent_checkpoint_id: "ParentCheckpointID"
          checkpoint_id: "CheckpointID"
          build_log: "BuildLog"
          work_summary: "WorkSummary"
          files_changed: "FilesChanged"
          build_duration_ms: "BuildDurationMs"
          dir_path: "DirPath"
          wasm_path: "WasmPath"
          server_port: "ServerPort"
          template_type: "TemplateType"
          prompt_text: "PromptText"
          last_accessed_at: "LastAccessedAt"
          mayor_name: "MayorName"
          mayor_personality: "MayorPersonality"
          mayor_secret: "MayorSecret"
          discord_channel_id: "DiscordChannelID"
          openclaw_agent_id: "OpenClawAgentID"
          discord_message_id: "DiscordMessageID"
          author_type: "AuthorType"
          author_name: "AuthorName"
          activity_type: "ActivityType"
          session_key: "SessionKey"
          message_count: "MessageCount"
          first_seen_at: "FirstSeenAt"
          last_active_at: "LastActiveAt"
          started_at: "StartedAt"
          completed_at: "CompletedAt"
          duration_seconds: "DurationSeconds"
          error_message: "ErrorMessage"
          invited_by: "InvitedBy"
          cover_image_path: "CoverImagePath"
          workflow_id: "WorkflowID"
          workflow_type: "WorkflowType"
          ticket_id: "TicketID"
          session_id: "SessionID"
          session_name: "SessionName"
          event_type: "EventType"
          agent_index: "AgentIndex"
          previous_workflow_id: "PreviousWorkflowID"
          branch_name: "BranchName"
          duration_sec: "DurationSec"
          total_tokens: "TotalTokens"
          project_id: "ProjectID"
          parent_id: "ParentID"
          synced_at: "SyncedAt"
          verified_at: "VerifiedAt"
          source_workflow_id: "SourceWorkflowID"
          source_session_id: "SourceSessionID"
          relevance_score: "RelevanceScore"
          referenced_count: "ReferencedCount"
          archived_at: "ArchivedAt"
          doc_path: "DocPath"
          digest_type: "DigestType"
          period_start: "PeriodStart"
          period_end: "PeriodEnd"
          learning_count: "LearningCount"
          action_items: "ActionItems"
          depends_on_ticket_id: "DependsOnTicketID"
        overrides:
          - db_type: "TIMESTAMP"
            go_type:
              import: "time"
              type: "Time"
            nullable: true
          - column: "checkpoints.status"
            go_type: "string"
          - column: "swarm_workflows.phase"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "Phase"
          - column: "swarm_workflows.status"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "WorkflowStatus"
          - column: "swarm_workflows.workflow_type"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "WorkflowType"
          - column: "swarm_sessions.phase"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "Phase"
          - column: "swarm_sessions.result"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "SessionResult"
          - column: "swarm_events.event_type"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "EventType"
          - column: "swarm_project_milestones.status"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "MilestoneStatus"
          - column: "swarm_learnings.category"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "LearningCategory"
          - column: "swarm_learnings.severity"
            go_type:
              import: "creative-mode/harness/internal/swarm"
              type: "LearningSeverity"
