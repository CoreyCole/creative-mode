comment: |
  ## Context
  - Mayor build execution is clearly mapped end-to-end: authenticated `POST /api/mayor/build` → checkpoint fork/orchestration → tmux Claude session → hook events via `/api/claude-event` → async checkpoint build completion.
  - Build lifecycle is checkpoint-centric (`building` → `ready`/`failed`) with status events over SSE and heavier logs served separately from disk-backed JSONL endpoints.
  - Observability and coordination tensions identified in scope for CRE-5 include: user-scoped active-build limiting vs world-scoped runtime constraints, fragmented status-vs-log correlation UX, and unclear authoritative lifecycle source between checkpoints and mayor-specific tables.
  - The research found no direct contradictions; findings are high-confidence, with remaining uncertainty focused on traceability coverage (especially whether `mayor_builds`/`mayor_sessions` are written in the hot mayor trigger path).

  ## Out of Scope
  - Determining and implementing an authoritative data model for mayor build tracking (checkpoints vs `mayor_builds`/`mayor_sessions`) is beyond this research artifact and should be handled as follow-up implementation/research planning.
  - Defining/implementing explicit world-level build serialization or queueing semantics for mayor-triggered builds is beyond this artifact’s audit scope.
  - Defining retry/cancel policy parity between mayor-triggered builds and Swarm/Temporal workflows is beyond this artifact’s scope.
